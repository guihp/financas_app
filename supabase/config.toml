[auth.email.template.recovery]
subject = "Recuperação de Senha - IAFÉ Finanças"
content_path = "supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Você foi convidado para o IAFÉ Finanças"
content_path = "supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no IAFÉ Finanças"
content_path = "supabase/templates/confirmation.html"

[functions.update-old-subscriptions]
enabled = true
verify_jwt = true
import_map = "./functions/update-old-subscriptions/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/update-old-subscriptions/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/update-old-subscriptions/*.html" ]

# Asaas chama process-asaas-webhook diretamente, sem JWT Supabase. A
# autenticidade do payload e validada dentro do handler via header
# `asaas-access-token` comparado com a env var ASAAS_WEBHOOK_TOKEN.
# Se verify_jwt=true o gateway Supabase rejeita as chamadas do Asaas
# antes do handler rodar (UNAUTHORIZED_NO_AUTH_HEADER), e a fila de
# eventos fica `interrupted` no painel do Asaas.
[functions.process-asaas-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/process-asaas-webhook/index.ts"

# Funcoes administrativas: exigem JWT de usuario + papel em user_roles
# (checado em _shared/admin-auth.ts).
[functions.debug-list-users]
verify_jwt = true

[functions.toggle-user-status]
verify_jwt = true

[functions.delete-user]
verify_jwt = true

[functions.confirm-user-email]
verify_jwt = true

[functions.auto-assign-super-admin]
verify_jwt = true

[functions.admin-update-user-role]
verify_jwt = true

# Funcoes chamadas pelo pg_cron/n8n/outras edge functions com a service key.
# verify_jwt fica false porque a SUPABASE_SERVICE_ROLE_KEY do runtime pode nao
# ser um JWT; a autenticacao e feita em _shared/service-auth.ts.
[functions.dispatch-notification]
verify_jwt = false

[functions.engagement-notifications]
verify_jwt = false

[functions.appointment-notifications]
verify_jwt = false

[functions.send-payment-email]
verify_jwt = false

# Chamadas pelo frontend antes do login (validacao propria no handler).
[functions.register-user]
verify_jwt = false

[functions.generate-otp]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false

# Validam o JWT do usuario dentro do handler.
[functions.invite-user]
verify_jwt = false

[functions.respond-invitation]
verify_jwt = false
